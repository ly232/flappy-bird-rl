cartpole1:
  env_id: CartPole-v1
  replay_buffer_capacity: 10000
  batch_size: 32
  epsilon_init: 1
  epsilon_decay: 0.9995
  epsilon_min: 0.05
  network_sync_rate: 10  # Sync target DQN with policy DQN every 10 steps.
  learning_rate_a: 0.0001
  discount_factor_g: 0.99
  stop_on_reward: 100000
  fc1_nodes: 10  # size of hidden layer.

flappybird1:
  env_id: FlappyBird-v0
  replay_buffer_capacity: 10000
  batch_size: 32
  epsilon_init: 1
  epsilon_decay: 0.99995
  epsilon_min: 0.05
  network_sync_rate: 10  # Sync target DQN with policy DQN every 10 steps.
  learning_rate_a: 0.0001
  discount_factor_g: 0.99
  stop_on_reward: 100000
  fc1_nodes: 512  # size of hidden layer.
