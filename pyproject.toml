[project]
name = "flappy-bird-rl"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "flappy-bird-gymnasium>=0.4.0",
    "gymnasium[other]>=1.2.3",
    "jaxtyping>=0.3.5",
    "matplotlib>=3.10.8",
    "numpy<2.0",
    "pygame>=2.6.1",
    "pytest>=9.0.2",
    "pyyaml>=6.0.3",
    "tensorflow>=2.16.2",
    "torch>=2.2.2",
    "tqdm>=4.67.1",
]

[tool.uv]
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'x86_64'",
]
